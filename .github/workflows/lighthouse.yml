name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Home, FAQ e uma ficha de curso (SSG) sao auditados aqui.
      # /mapa usa Leaflet + tiles externos do OpenStreetMap e tem Performance
      # instavel em CI; e auditado separadamente (fora deste gate).
      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.13.x autorun
