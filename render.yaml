services:
  - type: web
    name: portal-calouros-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        # Substitua pela URL real do frontend na Vercel após o primeiro deploy.
        value: https://portal-dos-calouros-ufsc.vercel.app
      - key: DATABASE_URL
        # Provisão inicial: SQLite em disco efêmero (dados de banco chegam na v1.1).
        # Para PostgreSQL gerenciado, criar um Render Postgres e trocar por fromDatabase.
        value: sqlite:///./app.db
